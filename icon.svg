<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Image Tiler">
  <title>Image Tiler</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8def" />
      <stop offset="1" stop-color="#3f6fd8" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc0f5" />
      <stop offset="1" stop-color="#7ba4ea" />
    </linearGradient>
  </defs>

  <!-- The picture: sky, a hill, a sun, and two text lines, drawn once. -->
  <rect x="6" y="12" width="52" height="40" rx="6" fill="url(#sky)" />
  <circle cx="45" cy="24" r="5" fill="#ffe08a" />
  <path d="M6 44 L22 30 L34 40 L44 33 L58 44 L58 46 A6 6 0 0 1 52 52 H12 A6 6 0 0 1 6 46 Z" fill="url(#ground)" />
  <g fill="#2b4d99">
    <rect x="12" y="17" width="16" height="3" rx="1.5" />
    <rect x="12" y="23" width="11" height="3" rx="1.5" />
  </g>

  <!-- The cut: the same picture, seen as four regions that each keep their own detail. -->
  <g fill="#ffffff" opacity="0.92">
    <rect x="30.5" y="12" width="1.4" height="40" />
    <rect x="6" y="31" width="52" height="1.4" />
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" opacity="0.95">
    <rect x="6.6" y="12.6" width="24.7" height="18.8" rx="3" />
    <rect x="32.7" y="12.6" width="24.7" height="18.8" rx="3" />
    <rect x="6.6" y="32.6" width="24.7" height="18.8" rx="3" />
    <rect x="32.7" y="32.6" width="24.7" height="18.8" rx="3" />
  </g>
</svg>
